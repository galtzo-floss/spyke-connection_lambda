# We want Exclude directives from different
# config files to get merged, not overwritten
inherit_mode:
  merge:
    - Exclude

require:
  - rubocop-lts
  - rubocop-packaging

inherit_gem:
  rubocop-lts: config/rubygem.yml
inherit_from:
  - .rubocop_rspec.yml
plugins:
  - rubocop-rspec
  - rubocop-on-rbs
  - rubocop-packaging

# Metrics cops are disabled in Standard by default)
Metrics:
  Enabled: true

Layout/LineLength:
  Max: 120

# Inside a RubyGem do not require a Gemfile to have defined versions.
# In fact, runtime dependencies that must be declared inside the Gemfile to override the source
#   should *not* specify a version.  Instead, they should rely on the version given by the gemspec.
# We do require the gemspec to have specified versions via cop Gemspec/DependencyVersion.
Bundler/GemVersion:
  Enabled: false

Bundler/OrderedGems:
  Enabled: true
  TreatCommentsAsGroupSeparators: false
AllCops:
  Exclude:
    - certs/**/*
    - checksums/**/*
    - docs/**/*
    - examples/**/*
    - fixtures/**/*
    - gemfiles/*.gemfile
    - gemfiles/vendor/**/*
    - pkg/**/*
    - README.md
    - results/**/*
    - spec/fixtures/**/*
    - tmp/**/*
    - vendor/**/*
    - "**/vendor/**/*"
    - AGENTS.md
RBS:
  Enabled: true
Layout/IndentationConsistency:
  Exclude: ['*.md']
# Appraisal uses this filename for the moving HEAD dependency fixture.
Naming/FileName:
  Exclude:
    - '**/vHEAD.gemfile'
